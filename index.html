<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NobodyKnows - Trading Platform</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0e121a; color: #ffffff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .platform { background: #151b26; padding: 30px; border-radius: 12px; max-width: 500px; width: 100%; border: 1px solid #222d3d; text-align: center; }
        h1 { color: #ff444f; margin-top: 0; }
        .btn { background: #ff444f; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-bottom: 20px; }
        .trade-zone { display: none; background: #1c2433; padding: 20px; border-radius: 8px; border: 1px solid #2e3b52; margin-top: 20px; }
        .price-box { font-size: 32px; font-weight: bold; color: #4caf50; margin: 15px 0; font-family: monospace; }
        .action-btns { display: flex; gap: 15px; }
        .buy-btn { background: #4caf50; color: white; flex: 1; padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        .sell-btn { background: #f44336; color: white; flex: 1; padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="platform">
        <h1>NOBODYKNOWS</h1>
        <p>Advanced Third-Party Deriv Trading Interface</p>
        
        <!-- Step 1: Authentication Button -->
        <button id="loginBtn" class="btn">Connect Your Deriv Account</button>

        <!-- Step 2: Live Trading Workspace -->
        <div id="tradeZone" class="trade-zone">
            <h3>Volatility 100 (1s) Index</h3>
            <div id="livePrice" class="price-box">Loading Price...</div>
            
            <div class="action-btns">
                <button id="buyBtn" class="buy-btn">Rise / Higher</button>
                <button id="sellBtn" class="sell-btn">Fall / Lower</button>
            </div>
        </div>
    </div>

    <script>
        const APP_ID = '348ff1xw5g7gtg0wg5nsk'; // Your real Deriv App ID
        let ws;

        // 1. Handle OAuth Authentication Redirect
        document.getElementById('loginBtn').addEventListener('click', () => {
            window.location.href = `https://deriv.com{APP_ID}`;
        });

        // 2. Check if user is returning with a secure token from Deriv
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token1');

        if (token) {
            // Hide login button, reveal trading interface
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('tradeZone').style.display = 'block';
            
            // Connect to Deriv's live data server
            initializeTrading(token);
        }

        // 3. Establish Live Connection and Stream Market Data
        function initializeTrading(authToken) {
            ws = new WebSocket(`wss://://derivws.com{APP_ID}`);

            ws.onopen = () => {
                // Send secure credentials to login the trader session
                ws.send(JSON.stringify({ authorize: authToken }));
                
                // Subscribe to a continuous stream of live market prices (Volatility 100 Index)
                ws.send(JSON.stringify({ ticks: '1HZ100V' }));
            };

            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);
                
                // Display the changing live price on your screen
                if (data.msg_type === 'tick' && data.tick) {
                    const priceElement = document.getElementById('livePrice');
                    priceElement.innerText = data.tick.quote;
                }
            };
        }
    </script>
</body>
</html>
